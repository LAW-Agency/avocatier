# Installateur Windows du logiciel des hôtes : npm run paquet → dist/
appId: mg.avocatier.hotes
productName: Chez L'Avocatier
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - package.json
extraResources:
  - from: resources/icon.png
    to: icon.png
win:
  icon: resources/icon.ico
  target: nsis
# Images de l'installateur : resources/installerSidebar.bmp et installerHeader.bmp (trouvées d'office dans
# buildResources), tirées de resources/installation.png par scripts/images-installateur.mjs
nsis:
  oneClick: false
  include: resources/installer.nsh
  language: "1036"
  installerLanguages:
    - fr_FR
  allowToChangeInstallationDirectory: true
  shortcutName: Chez L'Avocatier
  uninstallDisplayName: Chez L'Avocatier
  artifactName: Chez-LAvocatier-${version}-installation.${ext}
